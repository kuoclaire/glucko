<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glucko - Login</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <!-- Using an SVG or text for Glucko logo based on color --a1 -->
                <img src="glucko-logo.png" alt="Glucko Logo" class="glucko-logo" width="300px" height="auto">
                <p>Diabetes Management Database</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="role-select">Select Role</label>
                    <select id="role-select" class="input-field" onchange="toggleLoginFields()">
                        <option value="admin">Administrator</option>
                        <option value="doctor">Doctor/Physician</option>
                    </select>
                </div>

                <!-- Admin specific fields -->
                <div id="admin-fields" class="role-fields active">
                    <div class="form-group">
                        <label for="admin-code">6-Digit Access Code</label>
                        <input type="text" id="admin-code" class="input-field" placeholder="Enter 6-digit code"
                            maxlength="6">
                    </div>
                    <div class="form-group">
                        <label for="admin-password">Enter Password</label>
                        <input type="password" id="admin-password" class="input-field"
                            placeholder="••••••••">
                    </div>
                </div>

                <!-- Doctor specific fields -->
                <div id="doctor-fields" class="role-fields">
                    <div class="form-group">
                        <label for="hospital-select">Select Hospital (Location)</label>
                        <select id="hospital-select" class="input-field">
                            <option value="General Memorial Hospital">General Memorial Hospital</option>
                            <option value="Westside Clinic">Westside Clinic</option>
                            <option value="Downtown Health Center">Downtown Health Center</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="employee-id">Employee ID</label>
                        <input type="text" id="employee-id" class="input-field" placeholder="Enter Employee ID">
                    </div>
                    <div class="form-group">
                        <label for="doctor-password">Enter Password</label>
                        <input type="password" id="doctor-password" class="input-field" placeholder="••••••••">
                    </div>
                </div>

                <div class="error-msg" id="login-error"></div>

                <button type="submit" class="btn-primary">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Logic -->
    <script src="js/mockData.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Init login logic
        document.addEventListener('DOMContentLoaded', () => {
            toggleLoginFields();
            document.getElementById('login-form').addEventListener('submit', handleLogin);
        });

        function toggleLoginFields() {
            const role = document.getElementById('role-select').value;
            if (role === 'admin') {
                document.getElementById('admin-fields').classList.add('active');
                document.getElementById('doctor-fields').classList.remove('active');
            } else {
                document.getElementById('admin-fields').classList.remove('active');
                document.getElementById('doctor-fields').classList.add('active');
            }
        }
    </script>
</body>

</html>
